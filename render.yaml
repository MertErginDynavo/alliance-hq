services:
  - type: web
    name: alliance-hq-v3
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: alliance-hq-super-secure-jwt-secret-key-2024-render
      - key: SOCKET_CORS_ORIGIN
        value: https://alliance-hq.onrender.com